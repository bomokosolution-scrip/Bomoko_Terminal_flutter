name: Build iOS (non signé)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet iOS si absent
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            flutter create --platforms=ios --project-name terminal .
          fi

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler iOS sans signature
        run: flutter build ios --release --no-codesign

      - name: Créer l'IPA non signé
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-unsigned.ipa Payload

      - name: Envoyer l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app-unsigned.ipa
